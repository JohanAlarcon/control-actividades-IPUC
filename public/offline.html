<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#00338d" />
        <title>Sin conexión · Comités IPUC</title>
        <style>
            /* Copia de la paleta de resources/css/app.css: sin señal no llega el CSS compilado. */
            :root {
                --ipuc: #00338d;
                --ipuc-oscuro: #001a4d;
                --ipuc-dorado: #f0ab00;
                --tinta: #1a1a18;
                --tinta-suave: #5a5852;
                --fondo: #f2f5fa;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                background: var(--fondo);
                color: var(--tinta);
                font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            }

            header {
                padding: 32px 16px 64px;
                background: linear-gradient(135deg, var(--ipuc), var(--ipuc-oscuro));
                text-align: center;
            }

            header img {
                width: 160px;
                height: auto;
            }

            main {
                max-width: 32rem;
                margin: -32px auto 0;
                padding: 0 16px 32px;
            }

            .tarjeta {
                padding: 32px 20px;
                border-radius: 24px;
                background: #fff;
                box-shadow:
                    0 1px 2px rgb(0 51 141 / 0.06),
                    0 6px 16px rgb(0 51 141 / 0.07);
                text-align: center;
            }

            .icono {
                display: grid;
                place-items: center;
                width: 72px;
                height: 72px;
                margin: 0 auto 20px;
                border-radius: 50%;
                background: rgb(0 51 141 / 0.1);
                color: var(--ipuc);
            }

            h1 {
                margin: 0;
                font-size: 1.5rem;
                line-height: 1.3;
            }

            .barra {
                width: 48px;
                height: 4px;
                margin: 14px auto 16px;
                border-radius: 4px;
                background: var(--ipuc-dorado);
            }

            p {
                margin: 0;
                color: var(--tinta-suave);
                font-size: 1.125rem;
                line-height: 1.6;
            }

            button {
                width: 100%;
                min-height: 48px;
                margin-top: 28px;
                border: 0;
                border-radius: 12px;
                background: var(--ipuc);
                color: #fff;
                font: inherit;
                font-size: 1.125rem;
                font-weight: 600;
            }

            button:active {
                background: var(--ipuc-oscuro);
            }
        </style>
    </head>
    <body>
        <header>
            <img src="/img/logo-ipuc.webp" alt="Iglesia Pentecostal Unida de Colombia" />
        </header>

        <main>
            <div class="tarjeta">
                <div class="icono" aria-hidden="true">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h.01" />
                        <path d="M8.5 16.429a5 5 0 0 1 7 0" />
                        <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
                        <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
                        <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
                        <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
                        <path d="m2 2 20 20" />
                    </svg>
                </div>
                <h1>No hay conexión a internet</h1>
                <div class="barra" aria-hidden="true"></div>
                <p>El celular no tiene señal en este momento. Cuando vuelva, toque el botón para intentar de nuevo.</p>
                <button type="button" onclick="location.reload()">Intentar de nuevo</button>
            </div>
        </main>
    </body>
</html>
